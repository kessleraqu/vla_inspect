name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install VLA Inspect
        run: python -m pip install ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v

      - name: Check CLI
        run: vla-inspect --help